name: Sentinel Prime source snapshots

on:
  push:
    paths:
      - 'src/source-snapshot.ts'
      - 'src/free-source-discovery.ts'
      - 'src/candidate-validator.ts'
      - 'src/candidate-submit.ts'
      - 'src/evidence-discovery.ts'
      - 'src/outcome-tracker.ts'
      - 'candidate-staging.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/sentinel-source-snapshots.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: sentinel-source-snapshots-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check project
        run: npm run typecheck
      - name: Fetch permitted source snapshots (read-only)
        run: npm run research:fetch
        env:
          DELPHI_API_ACCESS_KEY: ${{ secrets.DELPHI_API_ACCESS_KEY }}
      - name: Discover and archive free public-source leads (GDELT + RSS/Atom)
        run: npm run research:free
      - name: Discover and stage evidence automatically
        run: npm run research:discover
        env:
          DELPHI_API_ACCESS_KEY: ${{ secrets.DELPHI_API_ACCESS_KEY }}
      - name: Merge manually staged candidates with automatic discoveries
        run: |
          node --input-type=module -e '
            import { readFile, writeFile } from "node:fs/promises";
            const [automatic, manual] = await Promise.all([
              readFile("candidate-staging.auto.json", "utf8").then(JSON.parse),
              readFile("candidate-staging.json", "utf8").then(JSON.parse)
            ]);
            const merged = [...new Map([...automatic, ...manual].map(candidate => [candidate.id, candidate])).values()];
            await writeFile("candidate-staging.auto.json", JSON.stringify(merged, null, 2) + "\n");
            console.log("Merged " + automatic.length + " automatic and " + manual.length + " manually staged candidates; " + merged.length + " unique total.");
          '
      - name: Validate automatically discovered and manually staged evidence
        run: npm run candidate:validate
        env:
          DELPHI_API_ACCESS_KEY: ${{ secrets.DELPHI_API_ACCESS_KEY }}
          SENTINEL_AUTONOMOUS_SUBMISSION_AUTHORIZED: 'true'
          CANDIDATES_FILE: candidate-staging.auto.json
      - name: Autonomously submit strictly validated evidence and verify Delphi receipts
        run: npm run candidate:submit
        env:
          DELPHI_API_ACCESS_KEY: ${{ secrets.DELPHI_API_ACCESS_KEY }}
          SENTINEL_AUTONOMOUS_SUBMISSION_AUTHORIZED: 'true'
          CANDIDATES_FILE: candidate-staging.auto.json
      - name: Track judgments and settlement outcomes
        if: always()
        run: npm run outcomes:track
        env:
          DELPHI_API_ACCESS_KEY: ${{ secrets.DELPHI_API_ACCESS_KEY }}
      - name: Upload source snapshots, validation, and submission receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-source-snapshots
          path: |
            reports/
            candidate-staging.auto.json
          if-no-files-found: error
          retention-days: 14
