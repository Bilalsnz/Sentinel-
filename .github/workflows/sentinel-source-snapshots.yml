name: Sentinel Prime source snapshots

on:
  push:
    paths:
      - 'src/source-snapshot.ts'
      - 'src/candidate-validator.ts'
      - 'src/candidate-submit.ts'
      - 'candidate-staging.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/sentinel-source-snapshots.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: read

concurrency:
  group: sentinel-source-snapshots
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Type-check project
        run: npm run typecheck
      - name: Fetch permitted source snapshots (read-only)
        run: npm run research:fetch
        env:
          DELPHI_API_ACCESS_KEY: ${{ secrets.DELPHI_API_ACCESS_KEY }}
      - name: Validate staged evidence candidates (no submission)
        run: npm run candidate:validate
        env:
          DELPHI_API_ACCESS_KEY: ${{ secrets.DELPHI_API_ACCESS_KEY }}
      - name: Submit pre-approved evidence and verify Delphi receipt
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: npm run candidate:submit
        env:
          DELPHI_API_ACCESS_KEY: ${{ secrets.DELPHI_API_ACCESS_KEY }}
      - name: Upload source snapshots, validation, and submission receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-source-snapshots
          path: reports/
          if-no-files-found: error
          retention-days: 14
