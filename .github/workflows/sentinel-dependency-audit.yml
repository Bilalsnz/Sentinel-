name: Sentinel Prime dependency audit and lockfile

on:
  push:
    paths:
      - '.github/workflows/sentinel-dependency-audit.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci
      - name: Run dependency audit
        run: |
          mkdir -p reports
          npm audit --json > reports/npm-audit.json || true
          npm audit --omit=dev || true
      - name: Commit reproducible lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f package-lock.json ]; then echo 'Lockfile missing'; exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then echo 'Lockfile unchanged'; else git commit -m 'Add reproducible npm lockfile'; git push; fi
      - name: Upload lockfile and audit report
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-dependency-audit
          path: |
            package-lock.json
            reports/npm-audit.json
          if-no-files-found: error
          retention-days: 14
