name: Sentinel Prime market scan

on:
  push:
    paths:
      - 'src/market-scan.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/sentinel-market-scan.yml'
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: sentinel-market-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Type-check project
        run: npm run typecheck
      - name: Run read-only market intelligence scan
        run: npm run market:scan
      - name: Upload market scan report
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-market-scan
          path: reports/
          if-no-files-found: error
          retention-days: 14
